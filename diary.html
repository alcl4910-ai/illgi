<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>나만의 평생 일기장</title>
    <style>
        /* 전체적인 디자인 (베이지 톤) */
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background-color: #f0e6d6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { display: flex; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; width: 1000px; height: 650px; }
        
        /* 왼쪽: 달력 영역 */
        .calendar-left { flex: 1; padding: 30px; border-right: 1px solid #eee; background-color: #fdf5e6; display: flex; flex-direction: column; }
        .cal-header { text-align: center; margin-bottom: 20px; }
        .year-select { font-size: 1.2rem; font-weight: bold; padding: 5px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc; text-align: center; }
        .month-control { display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 1.5rem; font-weight: bold; color: #c0392b; }
        .month-control button { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #c0392b; }
        
        /* 달력 그리드 */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; flex-grow: 1; }
        .day-name { font-weight: bold; color: #555; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 10px; }
        .sun { color: red; } .sat { color: blue; }
        .date-cell { padding: 15px 5px; cursor: pointer; border-radius: 8px; font-size: 1.1rem; transition: 0.2s; position: relative; }
        .date-cell:hover:not(.empty) { background-color: #e0d5c0; }
        .date-cell.selected { background-color: #c0392b; color: white; font-weight: bold; }
        .has-diary::after { content: '●'; color: #c0392b; font-size: 0.6rem; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); }
        
        /* 오른쪽: 일기 작성 영역 */
        .diary-right { flex: 1.2; padding: 40px; display: flex; flex-direction: column; background-color: #ffffff; }
        .date-title { font-size: 1.8rem; color: #c0392b; border-bottom: 2px solid #c0392b; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* 사진 업로드 및 미리보기 */
        .photo-area { margin-bottom: 15px; }
        #image-input { display: none; }
        .photo-btn { background-color: #555; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        #image-preview { width: 100%; max-height: 200px; display: none; object-fit: contain; background-color: #f9f9f9; border: 1px dashed #ccc; border-radius: 8px; margin-bottom: 10px; }
        
        /* 글쓰기 영역 */
        textarea { flex-grow: 1; width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 15px; font-size: 1.1rem; resize: none; background-color: #fafafa; line-height: 1.6; box-sizing: border-box; }
        .save-btn { background-color: #c0392b; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        .save-btn:hover { background-color: #a93226; }
    </style>
</head>
<body>

<div class="container">
    <div class="calendar-left">
        <div class="cal-header">
            <select class="year-select" id="year-select" onchange="changeYear()"></select>
            <div class="month-control">
                <button onclick="changeMonth(-1)">◀</button>
                <span id="month-display">4월</span>
                <button onclick="changeMonth(1)">▶</button>
            </div>
        </div>
        <div class="cal-grid" id="calendar-grid">
            <div class="day-name sun">일</div><div class="day-name">월</div><div class="day-name">화</div>
            <div class="day-name">수</div><div class="day-name">목</div><div class="day-name">금</div><div class="day-name sat">토</div>
            </div>
    </div>

    <div class="diary-right">
        <div class="date-title" id="selected-date-title">날짜를 선택하세요</div>
        
        <div class="photo-area">
            <input type="file" id="image-input" accept="image/*">
            <button class="photo-btn" onclick="document.getElementById('image-input').click()">📷 사진 추가</button>
            <img id="image-preview" src="" alt="사진 미리보기">
        </div>

        <textarea id="diary-content" placeholder="이 날의 일기를 적어보세요..."></textarea>
        <button class="save-btn" onclick="saveDiary()">일기 저장하기</button>
    </div>
</div>

<script>
    // 1. 저장된 데이터 불러오기 (브라우저 로컬 스토리지 활용)
    // 인터넷 창을 껐다 켜도 데이터가 날아가지 않게 해줍니다.
    let diaryData = JSON.parse(localStorage.getItem('myDiaryData')) || {};

    let currentDate = new Date(2026, 3, 1); 
    let selectedDateKey = ""; // 2026-4-27 같은 고유 키값
    let selectedDateText = ""; // 2026년 4월 27일 같은 화면 표시용
    
    // 연도 선택 드롭다운 채우기
    const yearSelect = document.getElementById('year-select');
    for (let i = 2020; i <= 2050; i++) {
        let option = document.createElement('option');
        option.value = i;
        option.text = i + "년";
        if (i === 2026) option.selected = true;
        yearSelect.appendChild(option);
    }

    // 달력 그리기 함수
    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        document.getElementById('year-select').value = year;
        document.getElementById('month-display').innerText = (month + 1) + "월";

        const grid = document.getElementById('calendar-grid');
        
        while (grid.children.length > 7) {
            grid.removeChild(grid.lastChild);
        }

        const firstDay = new Date(year, month, 1).getDay(); 
        const lastDate = new Date(year, month + 1, 0).getDate(); 

        for (let i = 0; i < firstDay; i++) {
            let emptyDiv = document.createElement('div');
            emptyDiv.className = 'date-cell empty';
            grid.appendChild(emptyDiv);
        }

        for (let i = 1; i <= lastDate; i++) {
            let dateDiv = document.createElement('div');
            dateDiv.className = 'date-cell';
            dateDiv.innerText = i;
            
            let dayOfWeek = new Date(year, month, i).getDay();
            if (dayOfWeek === 0) dateDiv.style.color = "red";
            if (dayOfWeek === 6) dateDiv.style.color = "blue";

            // 고유 날짜 키 (예: 2026-4-27)
            let dateKey = `${year}-${month + 1}-${i}`;

            // 이 날짜에 저장된 일기가 있다면 달력에 점(●) 표시
            if(diaryData[dateKey]) {
                dateDiv.classList.add('has-diary');
            }

            // 날짜 클릭 이벤트 ★(여기가 핵심입니다)★
            dateDiv.onclick = function() {
                document.querySelectorAll('.date-cell').forEach(el => el.classList.remove('selected'));
                dateDiv.classList.add('selected'); 

                selectedDateKey = dateKey;
                selectedDateText = `${year}년 ${month + 1}월 ${i}일`;
                document.getElementById('selected-date-title').innerText = selectedDateText;
                
                // 선택한 날짜에 저장된 데이터가 있는지 확인하고 불러오기
                if(diaryData[selectedDateKey]) {
                    // 텍스트 불러오기
                    document.getElementById('diary-content').value = diaryData[selectedDateKey].text;
                    
                    // 사진 불러오기
                    if(diaryData[selectedDateKey].photo) {
                        document.getElementById('image-preview').src = diaryData[selectedDateKey].photo;
                        document.getElementById('image-preview').style.display = "block";
                    } else {
                        document.getElementById('image-preview').style.display = "none";
                        document.getElementById('image-preview').src = "";
                    }
                } else {
                    // 저장된 게 없으면 창을 비워줌
                    document.getElementById('diary-content').value = ""; 
                    document.getElementById('image-preview').style.display = "none";
                    document.getElementById('image-preview').src = "";
                }
            };

            grid.appendChild(dateDiv);
        }
    }

    function changeYear() {
        currentDate.setFullYear(parseInt(document.getElementById('year-select').value));
        renderCalendar();
    }

    function changeMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    // 사진 미리보기 기능
    document.getElementById('image-input').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('image-preview');
                preview.src = e.target.result;
                preview.style.display = "block";
            }
            reader.readAsDataURL(file); // 사진을 문자열 데이터로 변환
        }
    });

    // 저장 버튼 누를 때 ★(여기도 핵심입니다)★
    function saveDiary() {
        if (!selectedDateKey) {
            alert("달력에서 먼저 날짜를 선택해주세요!");
            return;
        }
        
        const text = document.getElementById('diary-content').value;
        const photoSrc = document.getElementById('image-preview').src;
        const hasPhoto = document.getElementById('image-preview').style.display === "block";

        if (!text && !hasPhoto) {
            alert("일기 내용이나 사진을 추가해주세요!");
            return;
        }

        // diaryData 박스 안에 현재 날짜 키값으로 글과 사진을 저장
        diaryData[selectedDateKey] = {
            text: text,
            photo: hasPhoto ? photoSrc : null
        };

        // 브라우저의 로컬 스토리지에 영구(?) 저장
        localStorage.setItem('myDiaryData', JSON.stringify(diaryData));
        
        alert(selectedDateText + " 일기가 저장되었습니다!\n이제 다른 날짜를 누르거나 새로고침해도 글이 남아있습니다.");
        
        // 달력을 다시 그려서 일기가 있는 날짜에 점(●) 표시 업데이트
        renderCalendar(); 
    }

    renderCalendar();
</script>
</body>
</html>
